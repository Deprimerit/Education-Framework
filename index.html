<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Model Constitution for Adaptive, Evidence-Based Education</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face { font-display: swap; }

:root{
  --paper:#F7F7F4;
  --paper-raised:#FFFFFF;
  --ink:#161F36;
  --ink-soft:#4B5573;
  --ink-faint:#8891A6;
  --line:#E2E2DA;
  --line-strong:#CBCBC0;
  --navy:#1C2C4C;
  --navy-tint:#EEF1F8;
  --navy-tint-strong:#DEE5F3;
  --gold:#8C6A1E;
  --gold-tint:#F8F1DD;
  --gold-tint-strong:#F0E2B9;
  --shadow-sm:0 1px 2px rgba(22,31,54,.05);
  --shadow-md:0 10px 30px rgba(22,31,54,.08);
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --spine-w:52px;
  --toc-w:272px;
  --topbar-h:60px;
}

*{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
a{color:inherit;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--navy); outline-offset:2px;}

/* ---------- App shell ---------- */
.app{
  display:grid;
  grid-template-columns: var(--spine-w) var(--toc-w) 1fr;
  grid-template-rows: var(--topbar-h) 1fr;
  grid-template-areas:
    "spine topbar topbar"
    "spine toc reader";
  min-height:100vh;
}

/* ---------- Spine (signature element) ---------- */
.spine{
  grid-area:spine;
  background:var(--navy);
  display:flex;
  flex-direction:column;
  align-items:stretch;
  position:sticky;
  top:0;
  height:100vh;
  z-index:30;
  overflow-y:auto;
  scrollbar-width:none;
}
.spine::-webkit-scrollbar{display:none;}
.spine-home{
  height:var(--topbar-h);
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#EDE4C8;
  font-family:var(--serif);
  font-weight:700;
  font-size:19px;
  border-bottom:1px solid rgba(255,255,255,.12);
  cursor:pointer;
  background:transparent;
  border-left:none;border-right:none;border-top:none;
}
.spine-home:hover{background:rgba(255,255,255,.06);}
.spine-tab{
  flex:none;
  border:none;
  background:transparent;
  color:rgba(237,228,200,.62);
  font-family:var(--mono);
  font-size:13px;
  letter-spacing:.03em;
  padding:11px 0;
  cursor:pointer;
  position:relative;
  writing-mode:horizontal-tb;
  text-align:center;
}
.spine-tab span{display:block;}
.spine-tab:hover{color:#EDE4C8; background:rgba(255,255,255,.06);}
.spine-tab.active{color:#1C2C4C; background:#D9BE72;}
.spine-tab.active::after{
  content:"";
  position:absolute; left:100%; top:0; bottom:0; width:6px;
  background:#D9BE72;
}

/* ---------- Top bar ---------- */
.topbar{
  grid-area:topbar;
  background:var(--paper-raised);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
}
.menu-toggle{
  display:none;
  border:1px solid var(--line);
  background:var(--paper-raised);
  border-radius:6px;
  width:36px;height:36px;
  align-items:center;justify-content:center;
  cursor:pointer;
  flex:none;
}
.breadcrumb{
  font-family:var(--mono);
  font-size:12.5px;
  letter-spacing:.04em;
  color:var(--ink-faint);
  text-transform:uppercase;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  flex:1 1 auto;
  min-width:0;
}
.breadcrumb b{color:var(--ink-soft); font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:10px; flex:none;}
.progress-label{
  font-family:var(--mono);
  font-size:12px;
  color:var(--ink-faint);
  white-space:nowrap;
}
.search-btn{
  display:flex; align-items:center; gap:8px;
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:8px;
  padding:8px 12px;
  font-size:13.5px;
  color:var(--ink-soft);
  cursor:pointer;
}
.search-btn:hover{border-color:var(--line-strong); background:var(--paper-raised);}
.search-btn kbd{
  font-family:var(--mono);
  font-size:11px;
  border:1px solid var(--line-strong);
  border-radius:4px;
  padding:1px 5px;
  color:var(--ink-faint);
  background:var(--paper-raised);
}

/* ---------- TOC panel ---------- */
.toc-panel{
  grid-area:toc;
  background:var(--paper-raised);
  border-right:1px solid var(--line);
  overflow-y:auto;
  height:calc(100vh - var(--topbar-h));
  position:sticky;
  top:var(--topbar-h);
  padding:18px 0 60px;
}
.toc-part-head{
  padding:2px 20px 14px;
  border-bottom:1px solid var(--line);
  margin-bottom:6px;
}
.toc-part-eyebrow{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  color:var(--gold);
  text-transform:uppercase;
}
.toc-part-title{
  font-family:var(--serif);
  font-weight:700;
  font-size:16.5px;
  color:var(--ink);
  margin-top:3px;
  line-height:1.3;
}
.toc-list{list-style:none; margin:0; padding:8px 0;}
.toc-item{margin:0;}
.toc-link{
  display:block;
  width:100%;
  text-align:left;
  border:none;
  background:transparent;
  padding:9px 20px 9px 22px;
  cursor:pointer;
  border-left:3px solid transparent;
  font-size:13.5px;
  color:var(--ink-soft);
  line-height:1.4;
}
.toc-link:hover{background:var(--navy-tint);}
.toc-link.active{
  background:var(--navy-tint-strong);
  border-left-color:var(--navy);
  color:var(--ink);
  font-weight:600;
}
.toc-link .lbl{
  display:block;
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-faint);
  letter-spacing:.02em;
  margin-bottom:2px;
}
.toc-empty{padding:20px; font-size:13px; color:var(--ink-faint);}

/* ---------- Reader ---------- */
.reader{
  grid-area:reader;
  min-width:0;
  padding:48px 40px 120px;
  overflow-x:hidden;
}
.reader-inner{max-width:740px; margin:0 auto;}

/* Landing */
.hero{padding:34px 0 10px;}
.hero-eyebrow{
  font-family:var(--mono);
  font-size:12.5px;
  letter-spacing:.1em;
  color:var(--gold);
  text-transform:uppercase;
  margin-bottom:18px;
}
.hero h1{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(32px,4.4vw,52px);
  line-height:1.1;
  margin:0 0 18px;
  color:var(--navy);
  letter-spacing:-.01em;
}
.hero .sub{
  font-size:17px;
  color:var(--ink-soft);
  max-width:60ch;
  line-height:1.6;
  margin:0 0 26px;
}
.hero-stats{
  display:flex; flex-wrap:wrap; gap:0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  margin:26px 0 34px;
}
.hero-stat{
  flex:1 1 140px;
  padding:16px 20px 16px 0;
  border-right:1px solid var(--line);
}
.hero-stat:last-child{border-right:none;}
.hero-stat b{
  display:block;
  font-family:var(--serif);
  font-size:26px;
  color:var(--navy);
  font-weight:700;
}
.hero-stat span{font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em;}
.cta-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:52px;}
.btn-primary{
  background:var(--navy);
  color:#F3EFDF;
  border:none;
  padding:13px 22px;
  border-radius:6px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
  letter-spacing:.01em;
}
.btn-primary:hover{background:#243761;}
.btn-secondary{
  background:transparent;
  color:var(--ink);
  border:1px solid var(--line-strong);
  padding:13px 22px;
  border-radius:6px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
}
.btn-secondary:hover{border-color:var(--navy); background:var(--navy-tint);}

.toc-grid-head{
  font-family:var(--mono);
  font-size:12px;
  letter-spacing:.08em;
  color:var(--ink-faint);
  text-transform:uppercase;
  margin:0 0 16px;
  padding-top:8px;
  border-top:1px solid var(--line);
}
.toc-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:1px;
  background:var(--line);
  border:1px solid var(--line);
  margin-bottom:40px;
}
.toc-card{
  background:var(--paper-raised);
  padding:18px 20px;
  text-align:left;
  border:none;
  cursor:pointer;
  display:flex;
  gap:14px;
  align-items:flex-start;
}
.toc-card:hover{background:var(--navy-tint);}
.toc-card .num{
  font-family:var(--serif);
  font-weight:700;
  font-size:20px;
  color:var(--gold);
  flex:none;
  width:34px;
}
.toc-card .body b{
  display:block;
  font-size:14.5px;
  color:var(--ink);
  margin-bottom:3px;
  font-weight:600;
}
.toc-card .body span{font-size:12px; color:var(--ink-faint);}

/* Provision view */
.eyebrow-row{
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:10px;
  margin-bottom:10px;
}
.provision-eyebrow{
  font-family:var(--mono);
  font-size:12.5px;
  letter-spacing:.06em;
  color:var(--ink-faint);
  text-transform:uppercase;
}
.provision-title{
  font-family:var(--serif);
  font-weight:700;
  font-size:clamp(24px,3vw,32px);
  color:var(--navy);
  line-height:1.25;
  margin:0 0 30px;
}
.card{
  border-radius:4px;
  padding:26px 28px;
  margin-bottom:22px;
  border:1px solid var(--line);
}
.card-label{
  display:flex; align-items:center; gap:8px;
  font-family:var(--mono);
  font-size:11.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:14px;
  font-weight:600;
}
.card-ct{
  background:var(--navy-tint);
  border-left:3px solid var(--navy);
  border-color:var(--navy-tint-strong);
}
.card-ct .card-label{color:var(--navy);}
.card-ct p{
  font-family:var(--serif);
  font-size:18px;
  line-height:1.65;
  color:var(--ink);
  margin:0 0 14px;
}
.card-ct p:last-child{margin-bottom:0;}
.card-rat{
  background:var(--gold-tint);
  border-left:3px solid var(--gold);
  border-color:var(--gold-tint-strong);
}
.card-rat .card-label{color:var(--gold);}
.card-rat ul{list-style:none; margin:0; padding:0;}
.card-rat li{
  font-size:15px;
  line-height:1.65;
  color:var(--ink-soft);
  margin:0 0 14px;
  padding-left:16px;
  position:relative;
}
.card-rat li:last-child{margin-bottom:0;}
.card-rat li::before{
  content:"";
  position:absolute; left:0; top:9px;
  width:5px; height:5px;
  background:var(--gold);
  border-radius:50%;
}
.card-depth{
  background:var(--paper-raised);
  border-color:var(--line);
}
.card-depth .card-label{color:var(--ink-soft);}
.card-depth .depth-title{
  font-family:var(--serif);
  font-weight:600;
  font-size:16.5px;
  color:var(--ink);
  margin:0 0 14px;
}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.chip{
  font-size:12.5px;
  font-weight:600;
  color:var(--navy);
  background:var(--navy-tint);
  border:1px solid var(--navy-tint-strong);
  border-radius:20px;
  padding:5px 12px;
}
.card-depth p{
  font-size:14.5px;
  line-height:1.6;
  color:var(--ink-soft);
  margin:0 0 10px;
}
.card-depth p:last-child{margin-bottom:0;}

.provnav{
  display:flex; justify-content:space-between; gap:16px;
  margin-top:44px;
  padding-top:24px;
  border-top:1px solid var(--line);
}
.nav-btn{
  flex:1 1 0;
  display:flex; flex-direction:column;
  gap:4px;
  border:1px solid var(--line);
  background:var(--paper-raised);
  border-radius:6px;
  padding:14px 16px;
  cursor:pointer;
  text-align:left;
  max-width:340px;
}
.nav-btn:hover{border-color:var(--line-strong); background:var(--navy-tint);}
.nav-btn.next{text-align:right; margin-left:auto; align-items:flex-end;}
.nav-btn[disabled]{opacity:.35; cursor:not-allowed;}
.nav-btn[disabled]:hover{background:var(--paper-raised); border-color:var(--line);}
.nav-btn .dir{font-family:var(--mono); font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}
.nav-btn .lbl{font-size:13.5px; font-weight:600; color:var(--ink);}

/* ---------- Search overlay ---------- */
.search-overlay{
  position:fixed; inset:0;
  background:rgba(22,31,54,.45);
  z-index:100;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:10vh 20px 20px;
}
.search-overlay.open{display:flex;}
.search-box{
  background:var(--paper-raised);
  width:100%; max-width:620px;
  border-radius:10px;
  box-shadow:var(--shadow-md);
  overflow:hidden;
  max-height:70vh;
  display:flex; flex-direction:column;
}
.search-input-row{
  display:flex; align-items:center; gap:10px;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}
.search-input-row svg{flex:none; color:var(--ink-faint);}
#searchInput{
  border:none; outline:none;
  font-size:16px;
  flex:1;
  font-family:var(--sans);
  background:transparent;
  color:var(--ink);
}
.search-close{
  border:none; background:var(--paper); border-radius:5px;
  font-family:var(--mono); font-size:11px; color:var(--ink-faint);
  padding:5px 8px; cursor:pointer;
}
#searchResults{overflow-y:auto; padding:8px;}
.result{
  display:block; width:100%; text-align:left;
  border:none; background:transparent;
  padding:11px 14px; border-radius:6px; cursor:pointer;
}
.result:hover{background:var(--navy-tint);}
.result .r-eyebrow{font-family:var(--mono); font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.05em;}
.result .r-title{font-size:14.5px; font-weight:600; color:var(--ink); margin:2px 0 3px;}
.result .r-snippet{font-size:13px; color:var(--ink-faint); line-height:1.5;}
.result mark{background:#F0E2B9; color:var(--ink); border-radius:2px;}
.search-empty{padding:30px 20px; text-align:center; color:var(--ink-faint); font-size:14px;}
.search-hint{padding:30px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;}

/* ---------- Mobile ---------- */
.scrim{position:fixed; inset:0; background:rgba(22,31,54,.4); z-index:24; display:none;}
.scrim.open{display:block;}

@media (max-width: 900px){
  .app{grid-template-columns: 0 0 1fr; grid-template-areas:"topbar topbar topbar" "reader reader reader";}
  .spine{
    position:fixed; left:0; top:0; bottom:0; width:var(--spine-w); height:100vh;
    transform:translateX(calc(-1 * var(--spine-w)));
    transition:transform .18s ease;
  }
  .toc-panel{
    position:fixed; left:var(--spine-w); top:0; bottom:0; width:var(--toc-w);
    height:100vh;
    transform:translateX(calc(-1 * (var(--spine-w) + var(--toc-w))));
    transition:transform .18s ease;
    z-index:28;
  }
  .app.drawer-open .spine,
  .app.drawer-open .toc-panel{transform:translateX(0);}
  .menu-toggle{display:flex;}
  .reader{padding:32px 20px 100px;}
  .search-btn span{display:none;}
  .toc-grid{grid-template-columns:1fr;}
  .hero-stats{border:none; display:block;}
  .hero-stat{border:none; border-bottom:1px solid var(--line); padding:12px 0;}
}

</style>
</head>
<body>
<div class="app" id="app">
  <nav class="spine" id="spine"></nav>
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4.5H16M2 9H16M2 13.5H16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="topbar-right">
      <span class="progress-label" id="progressLabel"></span>
      <button class="search-btn" id="searchBtn">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="4.75" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Search</span>
        <kbd>/</kbd>
      </button>
    </div>
  </header>
  <aside class="toc-panel" id="tocPanel"></aside>
  <main class="reader" id="reader"></main>
</div>
<div class="scrim" id="scrim"></div>

<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <div class="search-input-row">
      <svg width="16" height="16" viewBox="0 0 15 15" fill="none"><circle cx="6.5" cy="6.5" r="4.75" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search the Constitution&hellip;" autocomplete="off">
      <button class="search-close" id="searchClose">ESC</button>
    </div>
    <div id="searchResults"></div>
  </div>
</div>

<script>
  window.__CONSTITUTION__ = JSON.parse(document.getElementById('constitution-data').textContent);

<script>
(function(){
  "use strict";

  var DATA = window.__CONSTITUTION__;

  /* ---------- Prepare data ---------- */
  function slugify(key){
    if (key === 'PREAMBLE') return 'preamble';
    if (key === 'NOTE') return 'note';
    if (key === 'ADOPTION') return 'adoption';
    var m = key.split(' ');
    return 'article-' + (m[1] || '').toLowerCase();
  }
  function spineLabel(part){
    if (part.key === 'PREAMBLE') return 'P';
    if (part.key === 'NOTE') return 'N';
    if (part.key === 'ADOPTION') return 'A';
    return part.numeral;
  }

  DATA.parts.forEach(function(part){
    part.slug = slugify(part.key);
    part.spine = spineLabel(part);
  });

  var FLAT = [];
  DATA.parts.forEach(function(part, pi){
    part.provisions.forEach(function(prov, vi){
      FLAT.push({ pi: pi, vi: vi, part: part, prov: prov, g: FLAT.length });
    });
  });
  var TOTAL = FLAT.length;

  var SEARCH_INDEX = FLAT.map(function(f){
    var hay = [f.prov.label, f.prov.title, f.prov.text.join(' '), f.prov.rationale.join(' ')].join(' ').toLowerCase();
    return { f: f, hay: hay };
  });

  /* ---------- DOM refs ---------- */
  var el = {
    app: document.getElementById('app'),
    spine: document.getElementById('spine'),
    toc: document.getElementById('tocPanel'),
    reader: document.getElementById('reader'),
    breadcrumb: document.getElementById('breadcrumb'),
    progress: document.getElementById('progressLabel'),
    menuToggle: document.getElementById('menuToggle'),
    searchBtn: document.getElementById('searchBtn'),
    searchOverlay: document.getElementById('searchOverlay'),
    searchInput: document.getElementById('searchInput'),
    searchResults: document.getElementById('searchResults'),
    searchClose: document.getElementById('searchClose'),
    scrim: document.getElementById('scrim')
  };

  /* ---------- Helpers ---------- */
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function paragraphs(items){
    var out = [];
    items.forEach(function(it){
      it.split('\n').forEach(function(line){
        if (line.trim()) out.push(line.trim());
      });
    });
    return out;
  }
  function isChip(s){
    return s.length < 50 && s.split(/\s+/).length <= 8;
  }

  /* ---------- Routing ---------- */
  function parseHash(){
    var h = location.hash.replace(/^#\/?/, '');
    if (!h) return null;
    var parts = h.split('/');
    var slug = decodeURIComponent(parts[0] || '');
    var pi = DATA.parts.findIndex(function(p){ return p.slug === slug; });
    if (pi < 0) return null;
    var vi = parseInt(parts[1], 10);
    if (isNaN(vi) || vi < 0 || vi >= DATA.parts[pi].provisions.length) vi = 0;
    return { pi: pi, vi: vi };
  }

  function goTo(pi, vi){
    location.hash = '#/' + DATA.parts[pi].slug + '/' + vi;
  }
  function goHome(){
    location.hash = '#/';
  }

  /* ---------- Rendering: Spine ---------- */
  function renderSpine(){
    var html = '<button class="spine-home" id="spineHome" title="Home" aria-label="Home">§</button>';
    DATA.parts.forEach(function(part, pi){
      html += '<button class="spine-tab" data-pi="' + pi + '" title="' + esc(part.title) + '"><span>' + esc(part.spine) + '</span></button>';
    });
    el.spine.innerHTML = html;
    document.getElementById('spineHome').addEventListener('click', function(){ goHome(); });
    el.spine.querySelectorAll('.spine-tab').forEach(function(btn){
      btn.addEventListener('click', function(){
        var pi = parseInt(btn.getAttribute('data-pi'), 10);
        goTo(pi, 0);
      });
    });
  }
  function updateSpineActive(loc){
    el.spine.querySelectorAll('.spine-tab').forEach(function(btn){
      var pi = parseInt(btn.getAttribute('data-pi'), 10);
      btn.classList.toggle('active', !!loc && loc.pi === pi);
    });
  }

  /* ---------- Rendering: TOC panel ---------- */
  function renderTocPanel(loc){
    if (!loc){
      el.toc.innerHTML = '<div class="toc-empty">Select an Article from the spine, or choose one on the right, to see its sections here.</div>';
      return;
    }
    var part = DATA.parts[loc.pi];
    var html = '<div class="toc-part-head"><div class="toc-part-eyebrow">' + esc(part.label || part.title) + '</div>' +
      '<div class="toc-part-title">' + esc(part.title) + '</div></div><ul class="toc-list">';
    part.provisions.forEach(function(prov, vi){
      html += '<li class="toc-item"><button class="toc-link' + (vi === loc.vi ? ' active' : '') + '" data-vi="' + vi + '">' +
        '<span class="lbl">' + esc(prov.label) + '</span>' + esc(prov.title) + '</button></li>';
    });
    html += '</ul>';
    el.toc.innerHTML = html;
    el.toc.querySelectorAll('.toc-link').forEach(function(btn){
      btn.addEventListener('click', function(){
        goTo(loc.pi, parseInt(btn.getAttribute('data-vi'), 10));
        closeDrawer();
      });
    });
  }

  /* ---------- Rendering: breadcrumb + progress ---------- */
  function updateChrome(loc){
    if (!loc){
      el.breadcrumb.innerHTML = '<b>A Model Constitution</b> for Adaptive, Evidence-Based Education';
      el.progress.textContent = '';
      return;
    }
    var part = DATA.parts[loc.pi];
    var prov = part.provisions[loc.vi];
    el.breadcrumb.innerHTML = esc(part.title) + ' &nbsp;/&nbsp; <b>' + esc(prov.label) + '</b>';
    var g = FLAT.findIndex(function(f){ return f.pi === loc.pi && f.vi === loc.vi; });
    el.progress.textContent = 'Provision ' + (g + 1) + ' of ' + TOTAL;
  }

  /* ---------- Rendering: Landing ---------- */
  function renderLanding(){
    var html = '<div class="reader-inner"><div class="hero">' +
      '<div class="hero-eyebrow">Full Constitutional Text &middot; Article-by-Article, Section-by-Section</div>' +
      '<h1>A Model Constitution for Adaptive, Evidence-Based Education</h1>' +
      '<p class="sub">Development, Skill, and Job Tiers: a framework for voluntary, modular adoption. Every provision is presented beside the reasoning behind it.</p>' +
      '<div class="hero-stats">' +
      '<div class="hero-stat"><b>18</b><span>Articles &amp; Front Matter</span></div>' +
      '<div class="hero-stat"><b>113</b><span>Provisions</span></div>' +
      '<div class="hero-stat"><b>113</b><span>Paired Rationales</span></div>' +
      '<div class="hero-stat"><b>62</b><span>In-Depth Panels</span></div>' +
      '</div>' +
      '<div class="cta-row">' +
      '<button class="btn-primary" id="ctaBegin">Begin Reading &nbsp;&rarr;</button>' +
      '<button class="btn-secondary" id="ctaSearch">Search the text</button>' +
      '</div>' +
      '<div class="toc-grid-head">Contents</div>' +
      '<div class="toc-grid">';
    DATA.parts.forEach(function(part, pi){
      html += '<button class="toc-card" data-pi="' + pi + '"><span class="num">' + esc(part.spine) + '</span>' +
        '<span class="body"><b>' + esc(part.title) + '</b><span>' + esc(part.stat.split('\u00b7')[0].trim()) + '</span></span></button>';
    });
    html += '</div></div></div>';
    el.reader.innerHTML = html;
    document.getElementById('ctaBegin').addEventListener('click', function(){ goTo(0, 0); });
    document.getElementById('ctaSearch').addEventListener('click', openSearch);
    el.reader.querySelectorAll('.toc-card').forEach(function(btn){
      btn.addEventListener('click', function(){ goTo(parseInt(btn.getAttribute('data-pi'), 10), 0); });
    });
  }

  /* ---------- Rendering: Provision ---------- */
  function renderInDepthBlock(block){
    var blocks = block.blocks;
    var chips = [], paras = [];
    blocks.forEach(function(b){
      var lines = b.split('\n').map(function(x){return x.trim();}).filter(Boolean);
      lines.forEach(function(line){
        if (isChip(line)) chips.push(line); else paras.push(line);
      });
    });
    var html = '<div class="card card-depth"><div class="card-label">In Depth</div>' +
      '<div class="depth-title">' + esc(block.title) + '</div>';
    if (chips.length) {
      html += '<div class="chips">' + chips.map(function(c){ return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div>';
    }
    paras.forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });
    html += '</div>';
    return html;
  }

  function renderProvision(loc){
    var part = DATA.parts[loc.pi];
    var prov = part.provisions[loc.vi];
    var g = FLAT.findIndex(function(f){ return f.pi === loc.pi && f.vi === loc.vi; });
    var prev = g > 0 ? FLAT[g - 1] : null;
    var next = g < TOTAL - 1 ? FLAT[g + 1] : null;

    var html = '<div class="reader-inner">' +
      '<div class="eyebrow-row"><div class="provision-eyebrow">' + esc(prov.label) + '</div></div>' +
      '<h1 class="provision-title">' + esc(prov.title) + '</h1>' +
      '<div class="card card-ct"><div class="card-label">Constitutional Text</div>';
    paragraphs(prov.text).forEach(function(p){ html += '<p>' + esc(p) + '</p>'; });
    html += '</div>';

    html += '<div class="card card-rat"><div class="card-label">Rationale</div><ul>';
    paragraphs(prov.rationale).forEach(function(p){ html += '<li>' + esc(p) + '</li>'; });
    html += '</ul></div>';

    prov.inDepth.forEach(function(block){ html += renderInDepthBlock(block); });

    html += '<div class="provnav">';
    if (prev){
      html += '<button class="nav-btn prev" id="navPrev"><span class="dir">&larr; Previous</span><span class="lbl">' + esc(prev.prov.title) + '</span></button>';
    } else {
      html += '<button class="nav-btn prev" disabled><span class="dir">&larr; Previous</span><span class="lbl">Start of document</span></button>';
    }
    if (next){
      html += '<button class="nav-btn next" id="navNext"><span class="dir">Next &rarr;</span><span class="lbl">' + esc(next.prov.title) + '</span></button>';
    } else {
      html += '<button class="nav-btn next" disabled><span class="dir">Next &rarr;</span><span class="lbl">End of document</span></button>';
    }
    html += '</div></div>';

    el.reader.innerHTML = html;
    if (prev) document.getElementById('navPrev').addEventListener('click', function(){ goTo(prev.pi, prev.vi); });
    if (next) document.getElementById('navNext').addEventListener('click', function(){ goTo(next.pi, next.vi); });
    el.reader.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  /* ---------- Master render ---------- */
  function render(){
    var loc = parseHash();
    updateSpineActive(loc);
    renderTocPanel(loc);
    updateChrome(loc);
    if (!loc) renderLanding(); else renderProvision(loc);
  }

  /* ---------- Search ---------- */
  function snippet(hay, rawTitle, query){
    var idx = hay.indexOf(query);
    if (idx < 0) return esc(rawTitle);
    var start = Math.max(0, idx - 40);
    var end = Math.min(hay.length, idx + query.length + 60);
    var s = (start > 0 ? '\u2026' : '') + hay.slice(start, end) + (end < hay.length ? '\u2026' : '');
    var re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return esc(s).replace(re, '<mark>$1</mark>');
  }

  function runSearch(q){
    q = q.trim().toLowerCase();
    if (!q){
      el.searchResults.innerHTML = '<div class="search-hint">Type to search across every provision and rationale.</div>';
      return;
    }
    var matches = SEARCH_INDEX.filter(function(item){ return item.hay.indexOf(q) !== -1; }).slice(0, 40);
    if (!matches.length){
      el.searchResults.innerHTML = '<div class="search-empty">No matches for &ldquo;' + esc(q) + '&rdquo;.</div>';
      return;
    }
    var html = '';
    matches.forEach(function(item){
      var f = item.f;
      html += '<button class="result" data-pi="' + f.pi + '" data-vi="' + f.vi + '">' +
        '<div class="r-eyebrow">' + esc(f.part.title) + ' &middot; ' + esc(f.prov.label) + '</div>' +
        '<div class="r-title">' + esc(f.prov.title) + '</div>' +
        '<div class="r-snippet">' + snippet(item.hay, f.prov.title, q) + '</div></button>';
    });
    el.searchResults.innerHTML = html;
    el.searchResults.querySelectorAll('.result').forEach(function(btn){
      btn.addEventListener('click', function(){
        goTo(parseInt(btn.getAttribute('data-pi'), 10), parseInt(btn.getAttribute('data-vi'), 10));
        closeSearch();
      });
    });
  }

  function openSearch(){
    el.searchOverlay.classList.add('open');
    el.searchInput.value = '';
    runSearch('');
    setTimeout(function(){ el.searchInput.focus(); }, 30);
  }
  function closeSearch(){
    el.searchOverlay.classList.remove('open');
  }

  /* ---------- Mobile drawer ---------- */
  function openDrawer(){ el.app.classList.add('drawer-open'); el.scrim.classList.add('open'); }
  function closeDrawer(){ el.app.classList.remove('drawer-open'); el.scrim.classList.remove('open'); }

  /* ---------- Wire up ---------- */
  renderSpine();
  window.addEventListener('hashchange', render);
  render();

  el.searchBtn.addEventListener('click', openSearch);
  el.searchClose.addEventListener('click', closeSearch);
  el.searchOverlay.addEventListener('click', function(e){ if (e.target === el.searchOverlay) closeSearch(); });
  el.searchInput.addEventListener('input', function(){ runSearch(el.searchInput.value); });

  el.menuToggle.addEventListener('click', function(){
    if (el.app.classList.contains('drawer-open')) closeDrawer(); else openDrawer();
  });
  el.scrim.addEventListener('click', closeDrawer);

  document.addEventListener('keydown', function(e){
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && tag !== 'INPUT'){
      e.preventDefault(); openSearch(); return;
    }
    if (e.key === 'Escape'){ closeSearch(); closeDrawer(); return; }
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var loc = parseHash();
    if (!loc) return;
    var g = FLAT.findIndex(function(f){ return f.pi === loc.pi && f.vi === loc.vi; });
    if (e.key === 'ArrowRight' && g < TOTAL - 1){ var n = FLAT[g+1]; goTo(n.pi, n.vi); }
    if (e.key === 'ArrowLeft' && g > 0){ var p = FLAT[g-1]; goTo(p.pi, p.vi); }
  });
})();

</script>
</body>
</html>
